---
name: YAML Lint

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  yaml-lint:

    name: Validate YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yamllint
        run: |
          python3 -m pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .
